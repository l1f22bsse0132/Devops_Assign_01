<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobileStore - Products</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>MobileStore</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="product-details.html">Details</a></li>
                <li><a href="promotions.html">Promotions</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="products-header">
            <h2>Our Products</h2>
            <p>Discover our wide range of mobile phones</p>
        </section>

        <section class="products-filter">
            <div class="filter-options">
                <select id="brand-filter">
                    <option value="">All Brands</option>
                    <option value="apple">Apple</option>
                    <option value="samsung">Samsung</option>
                    <option value="xiaomi">Xiaomi</option>
                </select>
                <select id="price-filter">
                    <option value="">Price Range</option>
                    <option value="0-300">$0 - $300</option>
                    <option value="300-600">$300 - $600</option>
                    <option value="600+">$600+</option>
                </select>
            </div>
        </section>

        <section class="products-grid">
            <div class="product-item">
                <img src="https://via.placeholder.com/200" alt="iPhone 15">
                <h4>iPhone 15</h4>
                <p>Advanced camera system</p>
                <span class="price">$799</span>
                <button class="view-details">View Details</button>
            </div>
            <div class="product-item">
                <img src="https://via.placeholder.com/200" alt="Samsung S24 Ultra">
                <h4>Samsung S24 Ultra</h4>
                <p>With S-Pen included</p>
                <span class="price">$1199</span>
                <button class="view-details">View Details</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 MobileStore. All rights reserved.</p>
    </footer>
</body>
</html>
